[project]
name = "memfxxk"
version = "0.1.0"
description = "Agent memory service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jieba>=0.42.1",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "tiktoken>=0.8",
    "typer>=0.15",
    "uuid-utils>=0.10",
    "uvicorn>=0.32",
]

[project.scripts]
memfxxk = "memfxxk.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
