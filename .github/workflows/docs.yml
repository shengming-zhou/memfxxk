name: Publish manuals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/.vitepress/**'
      - 'docs/en/**'
      - 'docs/index.md'
      - 'docs/user-manual.md'
      - 'docs/developer-manual.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build manuals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Build VitePress site
        run: |
          npm ci
          npm run docs:build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
